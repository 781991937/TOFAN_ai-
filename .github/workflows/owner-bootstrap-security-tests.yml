name: Owner Bootstrap Security Tests

on:
  pull_request:
    paths:
      - "supabase/functions/tofan-owner-bootstrap/**"
      - ".github/workflows/owner-bootstrap-security-tests.yml"
  push:
    branches:
      - "security/owner-bootstrap-test-hardening-20261027"
    paths:
      - "supabase/functions/tofan-owner-bootstrap/**"
      - ".github/workflows/owner-bootstrap-security-tests.yml"

permissions:
  contents: read

jobs:
  bootstrap-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run owner bootstrap validation tests with type checking
        run: deno test supabase/functions/tofan-owner-bootstrap/security_test.ts
