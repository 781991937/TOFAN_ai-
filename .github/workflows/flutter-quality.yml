name: Flutter quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            echo "::warning::pubspec.lock is out of date with pubspec.yaml"
            git diff -- pubspec.lock
          else
            echo "pubspec.lock is in sync with pubspec.yaml"
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
