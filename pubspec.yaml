name: tofan_ai
description: "TOFAN SMART ACADEMY — TOFAN AI STUDENT."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  dio: ^5.10.0
  google_fonts: ^6.3.2
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.10.3
  passkeys: 2.21.1 # pinned to avoid newer Dart 3.9+ package APIs
  shared_preferences: ^2.5.3
  uuid: ^4.5.3

# The 2.21.1 passkeys implementation predates the WebAuthn Signal API.
# Pin its interface to the older 2.8.0 contract instead of
# resolving the newer 2.9+ interface, which adds methods the implementation lacks.
dependency_overrides:
  passkeys_platform_interface: 2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
